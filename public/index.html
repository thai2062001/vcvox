<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOICEVOX Studio & AI Script Optimizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
      --card-bg: rgba(22, 27, 34, 0.88);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #a855f7;
      --emerald: #10b981;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --input-bg: rgba(13, 17, 23, 0.95);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .title-group h1 {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-group p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .status-badge {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.1);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .toggle-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--emerald);
      cursor: pointer;
    }

    .toggle-group input {
      accent-color: var(--emerald);
      cursor: pointer;
    }

    textarea, select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text);
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 95px;
      line-height: 1.5;
    }

    /* Khung kết quả tối ưu hóa */
    .optimizer-box {
      margin-top: 10px;
      padding: 12px 14px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px dashed rgba(16, 185, 129, 0.3);
      border-radius: 10px;
      font-size: 13px;
      display: none;
    }

    .optimizer-box-title {
      font-weight: 600;
      color: var(--emerald);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .changes-list {
      list-style: none;
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .change-item {
      font-size: 12px;
      color: #cbd5e1;
    }

    .change-item span.from {
      color: #f87171;
      text-decoration: line-through;
    }

    .change-item span.to {
      color: #34d399;
      font-weight: 600;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .sliders-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
      background: rgba(0, 0, 0, 0.25);
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      margin-bottom: 18px;
    }

    .slider-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }

    .slider-header span.val {
      color: var(--primary);
      font-weight: 600;
    }

    input[type="range"] {
      accent-color: var(--primary);
      cursor: pointer;
    }

    .btn-action {
      width: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s, opacity 0.2s;
    }

    .btn-action:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn-action:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .audio-player-box {
      margin-top: 20px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 10px;
      border: 1px solid var(--card-border);
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    audio {
      width: 100%;
      border-radius: 8px;
    }

    .download-link {
      color: var(--primary);
      font-size: 13px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }

    .download-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="title-group">
        <h1>VOICEVOX Studio & AI Optimizer</h1>
        <p>Bộ tạo giọng tiếng Nhật + Tự động chống vấp, ngọng Kanji & Furigana</p>
      </div>
      <div class="status-badge" id="statusBadge">
        <span class="status-dot"></span>
        <span id="statusText">Đang tải...</span>
      </div>
    </div>

    <!-- Nhập nội dung tiếng Nhật -->
    <div class="form-group">
      <div class="label-row">
        <label for="textInput">Văn bản tiếng Nhật (Japanese Script)</label>
        <label class="toggle-group" title="Tự động sửa lỗi Kanji đa âm, xóa ngoặc Furigana gây lặp từ, chuẩn hóa từ viết tắt PSI/ROV...">
          <input type="checkbox" id="chkOptimize" checked>
          <span>Bật Anti-Glitch & Tối ưu Kanji</span>
        </label>
      </div>
      <textarea id="textInput" placeholder="Nhập câu tiếng Nhật cần đọc...">隔壁（かくへき）が圧壊し、水深600mの南大西洋に米潜水艦が沈没した。水音が響く中、原子力潜水艦の18層が耐えられるか？14.7PSIの圧力がかかる。</textarea>
      
      <!-- Hộp hiển thị kết quả tối ưu -->
      <div class="optimizer-box" id="optimizerBox">
        <div class="optimizer-box-title">
          ✨ Đã tự động phát hiện & tối ưu kịch bản:
        </div>
        <div id="optimizedContent" style="color: #f1f5f9; margin-bottom: 6px;"></div>
        <ul class="changes-list" id="changesList"></ul>
      </div>
    </div>

    <!-- Chọn nhân vật & Phong cách -->
    <div class="form-group row-2">
      <div>
        <label for="speakerSelect">Nhân vật (Character)</label>
        <select id="speakerSelect">
          <option value="">Đang tải danh sách...</option>
        </select>
      </div>
      <div>
        <label for="styleSelect">Cảm xúc / Style</label>
        <select id="styleSelect">
          <option value="">Chọn nhân vật trước</option>
        </select>
      </div>
    </div>

    <!-- Thanh trượt điều chỉnh -->
    <div class="sliders-grid">
      <div class="slider-item">
        <div class="slider-header">
          <span>Tốc độ (Speed)</span>
          <span class="val" id="speedVal">1.10x</span>
        </div>
        <input type="range" id="speedRange" min="0.5" max="2.0" step="0.05" value="1.10">
      </div>

      <div class="slider-item">
        <div class="slider-header">
          <span>Cao độ (Pitch)</span>
          <span class="val" id="pitchVal">-0.02</span>
        </div>
        <input type="range" id="pitchRange" min="-0.15" max="0.15" step="0.01" value="-0.02">
      </div>

      <div class="slider-item">
        <div class="slider-header">
          <span>Nhấn nhá (Emotion)</span>
          <span class="val" id="intonationVal">1.1x</span>
        </div>
        <input type="range" id="intonationRange" min="0.0" max="2.0" step="0.1" value="1.1">
      </div>
    </div>

    <!-- Nút phát -->
    <button class="btn-action" id="btnSynthesize">
      <span>▶ Tạo & Nghe giọng nói</span>
    </button>

    <!-- Hộp phát âm thanh -->
    <div class="audio-player-box" id="playerBox">
      <audio id="audioPlayer" controls></audio>
      <a id="downloadBtn" class="download-link" href="#" download="voicevox-speech.wav">⬇ Tải file âm thanh (.wav)</a>
    </div>
  </div>

  <script>
    let allSpeakers = [];
    const speakerSelect = document.getElementById("speakerSelect");
    const styleSelect = document.getElementById("styleSelect");
    const textInput = document.getElementById("textInput");
    const chkOptimize = document.getElementById("chkOptimize");
    const optimizerBox = document.getElementById("optimizerBox");
    const optimizedContent = document.getElementById("optimizedContent");
    const changesList = document.getElementById("changesList");
    const btnSynthesize = document.getElementById("btnSynthesize");
    const playerBox = document.getElementById("playerBox");
    const audioPlayer = document.getElementById("audioPlayer");
    const downloadBtn = document.getElementById("downloadBtn");
    const statusText = document.getElementById("statusText");

    const speedRange = document.getElementById("speedRange");
    const pitchRange = document.getElementById("pitchRange");
    const intonationRange = document.getElementById("intonationRange");

    const speedVal = document.getElementById("speedVal");
    const pitchVal = document.getElementById("pitchVal");
    const intonationVal = document.getElementById("intonationVal");

    // Đồng bộ giá trị thanh trượt
    speedRange.oninput = () => speedVal.textContent = `${speedRange.value}x`;
    pitchRange.oninput = () => pitchVal.textContent = pitchRange.value;
    intonationRange.oninput = () => intonationVal.textContent = `${intonationRange.value}x`;

    // Preview tối ưu hóa khi gõ chữ
    let debounceTimer;
    textInput.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(checkOptimization, 400);
    });

    chkOptimize.addEventListener("change", checkOptimization);

    async function checkOptimization() {
      if (!chkOptimize.checked) {
        optimizerBox.style.display = "none";
        return;
      }
      const text = textInput.value.trim();
      if (!text) {
        optimizerBox.style.display = "none";
        return;
      }

      try {
        const res = await fetch("/api/optimize-preview", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        const data = await res.json();
        if (data.changes && data.changes.length > 0) {
          optimizerBox.style.display = "block";
          optimizedContent.innerHTML = `<strong>Kịch bản chuẩn:</strong> ${escapeHtml(data.optimizedText)}`;
          changesList.innerHTML = data.changes.map(c => 
            `<li class="change-item">• <span class="from">${escapeHtml(c.from)}</span> ➔ <span class="to">${escapeHtml(c.to)}</span> <em style="color:#94a3b8">(${escapeHtml(c.rule)})</em></li>`
          ).join("");
        } else {
          optimizerBox.style.display = "none";
        }
      } catch (err) {
        console.error(err);
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Tải danh sách nhân vật
    async function loadSpeakers() {
      try {
        const res = await fetch("/api/speakers");
        allSpeakers = await res.json();
        speakerSelect.innerHTML = "";

        allSpeakers.forEach((s, idx) => {
          const opt = document.createElement("option");
          opt.value = idx;
          opt.textContent = s.name;
          speakerSelect.appendChild(opt);
        });

        // Mặc định chọn giọng nam trầm Aoyama Ryusei (青山龍星) nếu có
        const ryuseiIndex = allSpeakers.findIndex(s => s.name.includes("青山龍星"));
        if (ryuseiIndex !== -1) {
          speakerSelect.value = ryuseiIndex;
        }

        updateStyles();
        checkOptimization();
        statusText.textContent = `Online (${allSpeakers.length} nhân vật)`;
      } catch (err) {
        statusText.textContent = "Mất kết nối";
        speakerSelect.innerHTML = "<option>Lỗi tải nhân vật</option>";
      }
    }

    function updateStyles() {
      const spIndex = speakerSelect.value;
      if (spIndex === "" || !allSpeakers[spIndex]) return;
      const speaker = allSpeakers[spIndex];
      styleSelect.innerHTML = "";

      speaker.styles.forEach(st => {
        const opt = document.createElement("option");
        opt.value = st.id;
        opt.textContent = `${st.name} (ID: ${st.id})`;
        styleSelect.appendChild(opt);
      });
    }

    speakerSelect.addEventListener("change", updateStyles);

    // Tạo âm thanh
    btnSynthesize.addEventListener("click", async () => {
      const text = textInput.value.trim();
      const speakerId = styleSelect.value;

      if (!text) {
        alert("Vui lòng nhập văn bản tiếng Nhật!");
        return;
      }

      btnSynthesize.disabled = true;
      btnSynthesize.textContent = "⏳ Đang kết nối Colab & tổng hợp...";

      try {
        const res = await fetch("/api/synthesize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text,
            speakerId,
            speedScale: speedRange.value,
            pitchScale: pitchRange.value,
            intonationScale: intonationRange.value,
            optimize: chkOptimize.checked
          })
        });

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.error || "Lỗi tổng hợp âm thanh");
        }

        const blob = await res.blob();
        const audioUrl = URL.createObjectURL(blob);

        audioPlayer.src = audioUrl;
        downloadBtn.href = audioUrl;
        playerBox.style.display = "flex";
        audioPlayer.play();
      } catch (err) {
        alert("Lỗi: " + err.message);
      } finally {
        btnSynthesize.disabled = false;
        btnSynthesize.innerHTML = "<span>▶ Tạo & Nghe giọng nói</span>";
      }
    });

    loadSpeakers();
  </script>
</body>
</html>
